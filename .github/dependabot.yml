version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "maven"
    directory: "/"
    groups:
      maven-dependencies:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    groups:
      docker-dependencies:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
