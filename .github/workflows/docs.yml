name: Build workshop docs and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build and Deploy

    permissions:
      contents: write
      pages: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 18

    - name: Set up Java
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'microsoft'
        java-version: '25'

    - name: Generate docs
      run: |
        cd docs
        shopt -s globstar
        npx -y cxa-track -t javascript-0000-yolasors **/*.adoc
        VERSION="sha.$(git rev-parse --short HEAD)"
        perl -i -pe "s/1.0.0-SNAPSHOT/$VERSION/g" pom.xml
        mvn generate-resources
        npx -y @moaw/cli@latest convert src/docs/asciidoc/index.adoc -a src/docs/asciidoc/attributes.json -d target/generated-docs/workshop.md

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
      if: ${{ github.ref == 'refs/heads/main' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/target/generated-docs/

    - name: Get GitHub Pages URL
      id: deployment
      if: ${{ github.ref == 'refs/heads/main' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        page_url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')"
        if [[ -z "$page_url" || "$page_url" == "null" ]]; then
          echo "::error::GitHub Pages URL is not configured."
          exit 1
        fi
        printf 'page_url=%s\n' "$page_url" >> "$GITHUB_OUTPUT"
